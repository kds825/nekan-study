<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공부방</title>
<meta name="description" content="필요할 때 꺼내 쓰는 작은 학습 앱 모음. 네칸 공부 등 앱을 한곳에서 엽니다.">
<meta name="theme-color" content="#0d6b66">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='5' fill='none' stroke='%230d6b66' stroke-width='3'/%3E%3Cpath fill='%230d6b66' d='M9 9h6v6H9zM17 17h6v6h-6z'/%3E%3C/svg%3E">
<script>
  /* 예전 주소(…/nekan-study/#learn-… 등)로 들어온 사람은 네칸 앱으로 바로 보낸다. 진행 기록은 같은 사이트라 그대로 있다. */
  if (/^#(learn-|topic-|wrong$|notes$)/.test(location.hash)) location.replace("apps/nekan/" + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 네칸 공부와 같은 모눈종이 바탕과 색. 한 줄 단에 앱 카드를 쌓고, 맨 아래에 새 앱 요청 카드를 둔다. */
:root {
  color-scheme: light dark;
  --bg: #f3f6f4; --grid: #e6ece9; --fg: #16282b; --muted: #55686b; --surface: #ffffff; --line: #cdd8d4;
  --accent: #0d6b66; --accent-ink: #ffffff;
  --display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #10191b; --grid: #162225; --fg: #e6eeec; --muted: #9db0ae; --surface: #18262a; --line: #2f4346;
  --accent: #4fc4ba; --accent-ink: #08201f;
} }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background-color: var(--bg); color: var(--fg); font: 400 16px/1.7 var(--body); word-break: keep-all; overflow-wrap: anywhere;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
main { max-width: 640px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.25; margin: 0; }
h1 { font-size: 2.2rem; } h2 { font-size: 1.4rem; } h3 { font-size: 1.25rem; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.brand { display: flex; gap: 14px; align-items: center; }
.logo { width: 56px; height: 56px; flex: none; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.app { display: flex; gap: 14px; align-items: flex-start; padding: 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
a.app:hover, a.app:focus-visible { border-color: var(--accent); outline: none; }
.app .icon { width: 48px; height: 48px; flex: none; }
.app .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.badge { align-self: flex-start; font: 500 .75rem/1.4 var(--mono); padding: 1px 8px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); }
.badge.soon { border-color: var(--line); color: var(--muted); }
.meter { font: 500 .82rem/1.5 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.card { padding: 16px; background: var(--surface); border: 1.5px dashed var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
input, textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; }
textarea { min-height: 96px; font-size: .9rem; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 700 1rem var(--body); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.btn.ghost { background: transparent; color: var(--accent); }
.note { padding: 10px 14px; border-radius: 6px; border: 1.5px solid var(--line); }
</style>
</head>
<body>
<main id="main">
  <header class="brand">
    <svg class="logo" viewBox="0 0 56 56" aria-hidden="true"><rect x="3" y="3" width="50" height="50" rx="10" fill="none" stroke="var(--accent)" stroke-width="4"/><rect x="14" y="14" width="12" height="12" rx="2" fill="var(--accent)"/><rect x="30" y="30" width="12" height="12" rx="2" fill="var(--accent)"/><rect x="30" y="14" width="12" height="12" rx="2" fill="none" stroke="var(--accent)" stroke-width="2.5"/><rect x="14" y="30" width="12" height="12" rx="2" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>
    <div>
      <h1 id="pname">공부방</h1>
      <p class="muted small" id="ptag">필요할 때 꺼내 쓰는 작은 학습 앱 모음</p>
    </div>
  </header>
  <section class="stack" aria-labelledby="apps-h">
    <h2 id="apps-h">앱</h2>
    <div class="stack" id="apps"><p class="muted">앱 목록을 불러오는 중입니다.</p></div>
  </section>
  <section class="card" aria-labelledby="new-h">
    <h3 id="new-h">새 앱 만들기</h3>
    <p class="small">만들고 싶은 앱을 적으면 Claude Code에 보낼 요청문을 만들어 드립니다. 복사해서 Claude Code에 붙여 넣으면 이 플랫폼에 앱이 추가됩니다.</p>
    <label class="small muted" for="idea">어떤 앱인가요?</label>
    <input id="idea" type="text" placeholder="예: 영어 단어 카드, 하루 지출 기록, 회의록 정리" autocomplete="off">
    <textarea id="req" readonly aria-label="Claude Code 요청문"></textarea>
    <div class="row">
      <button class="btn" id="copy" type="button">요청문 복사</button>
      <a class="btn ghost" href="https://claude.ai/code" target="_blank" rel="noopener">Claude Code 열기</a>
    </div>
  </section>
  <p class="note small muted">각 앱의 기록은 지금 쓰는 기기의 브라우저에만 저장됩니다. 다른 기기로 옮길 때는 각 앱의 백업 기능을 씁니다.</p>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, props, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) if (v !== undefined && v !== null) n.setAttribute(k, v);
    for (const c of kids.flat()) if (c !== null && c !== undefined) n.append(c);
    return n;
  };
  const svg = markup => { const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstChild; };
  const ICONS = {
    people: '<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="17" cy="17" r="8" fill="var(--accent)"/><circle cx="33" cy="17" r="7" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M3 42c1.5-8 7-12 14-12s12.5 4 14 12z" fill="var(--accent)"/><path d="M30 31c6 0 12 3 14 11" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>',
    cells: '<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="var(--accent)" d="M4 4h18v18H4zM26 4h18v18H26zM4 26h18v18H4z"/><path fill="none" stroke="var(--accent)" stroke-width="3" d="M27.5 27.5h15v15h-15z"/></svg>'
  };
  const letterIcon = name => svg(`<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="8" fill="none" stroke="var(--accent)" stroke-width="3"/><text x="24" y="31" text-anchor="middle" font-size="20" fill="var(--accent)" font-family="sans-serif">${String(name || "?").slice(0, 1).replace(/[<&>"]/g, "")}</text></svg>`);

  /* 앱별 짧은 현황. 첫 화면은 앱 데이터를 직접 읽지 않고, 각 앱이 남긴 요약 한 줄(platform-summary:<id>)만 읽는다. */
  function summaryOf(id) {
    try { const d = JSON.parse(localStorage.getItem("platform-summary:" + id) || "null"); return d?.text ? String(d.text) : null; }
    catch { return null; }
  }

  function appCard(a) {
    const live = a.status === "live";
    const icon = ICONS[a.icon] ? svg(ICONS[a.icon]) : letterIcon(a.name);
    const summary = live ? summaryOf(a.id) : null;
    const body = el("div", { class: "body" },
      el("span", { class: "badge" + (live ? "" : " soon") }, live ? "사용 중" : "준비 중"),
      el("h3", null, a.name),
      el("p", { class: "small muted" }, a.description || ""),
      summary ? el("p", { class: "meter" }, summary) : null);
    return live ? el("a", { class: "app", href: a.path }, icon, body) : el("div", { class: "app", "aria-disabled": "true" }, icon, body);
  }

  function request() {
    const idea = $("idea").value.trim() || "(만들고 싶은 앱)";
    return `nekan-study 저장소의 CLAUDE.md를 따라 공부방 플랫폼에 새 앱을 추가해 줘. 앱 내용: ${idea}. apps/ 아래에 폴더를 만들고 apps.json에 등록한 뒤 검사를 통과시키고 main에 반영해 줘.`;
  }
  $("req").value = request();
  $("idea").addEventListener("input", () => { $("req").value = request(); $("copy").textContent = "요청문 복사"; });
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("req").value); $("copy").textContent = "복사했어요"; }
    catch { $("req").focus(); $("req").select(); }
  });

  fetch("apps.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    if (data.platform?.name) { $("pname").textContent = data.platform.name; document.title = data.platform.name; }
    if (data.platform?.tagline) $("ptag").textContent = data.platform.tagline;
    const apps = (data.apps || []).slice().sort((x, y) => (x.status === "live" ? 0 : 1) - (y.status === "live" ? 0 : 1));
    $("apps").replaceChildren(...(apps.length ? apps.map(appCard) : [el("p", { class: "muted" }, "아직 앱이 없습니다.")]));
  }).catch(() => {
    $("apps").replaceChildren(el("p", { class: "muted" }, "앱 목록을 불러오지 못했습니다. 새로 고침해 주세요."), appCard({ id: "nekan", name: "네칸 공부", path: "apps/nekan/", icon: "cells", status: "live" }));
  });
})();
</script>
</body>
</html>
