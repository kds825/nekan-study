<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect</title>
<meta name="description" content="명함을 찍거나 리멤버에서 내보낸 파일을 올려 이 기기 안에서만 정리하고, 사람과 회사를 묻고 찾는 인맥 앱.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d6b66">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='12' r='5' fill='%230d6b66'/%3E%3Ccircle cx='22' cy='12' r='5' fill='none' stroke='%230d6b66' stroke-width='2.5'/%3E%3Cpath d='M3 27c1-5 4-7 8-7s7 2 8 7' fill='%230d6b66'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 공부방과 같은 모눈종이 바탕. 위쪽 탭(사람·묻기·가져오기)으로 오가고, 한 줄 단에 카드를 쌓는다.
   명함 데이터는 이 브라우저의 localStorage에만 두며 서버나 저장소로 보내지 않는다. */
:root {
  color-scheme: light dark;
  --bg: #f3f6f4; --grid: #e6ece9; --fg: #16282b; --muted: #55686b; --surface: #ffffff; --line: #cdd8d4;
  --accent: #0d6b66; --accent-ink: #ffffff; --mark: #ffe45c; --mark-fg: #16282b;
  --good: #17693f; --good-bg: #e2f4e9; --bad: #a93127; --bad-bg: #fbe9e6;
  --display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #10191b; --grid: #162225; --fg: #e6eeec; --muted: #9db0ae; --surface: #18262a; --line: #2f4346;
  --accent: #4fc4ba; --accent-ink: #08201f; --mark: #5c5000; --mark-fg: #fff4b0;
  --good: #6ad698; --good-bg: #12301f; --bad: #ff9c8f; --bad-bg: #3a1a16;
} }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background-color: var(--bg); color: var(--fg); font: 400 16px/1.65 var(--body); word-break: keep-all; overflow-wrap: anywhere;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
#app { max-width: 640px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 104px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.25; margin: 0; }
h1 { font-size: 2rem; } h2 { font-size: 1.4rem; } h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; min-height: 40px; color: var(--accent); text-decoration: none; font-weight: 500; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.tabs { display: grid; grid-template-columns: repeat(var(--tabs, 4), 1fr); gap: 6px; position: sticky; top: 0; z-index: 3; background: var(--bg); padding-block: 6px; }
.tabs button { min-height: 44px; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); font: 400 1.05rem var(--display); cursor: pointer; }
.tabs button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.card { padding: 14px 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
.person { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; color: inherit; font: inherit; cursor: pointer; }
.person:hover, .person:focus-visible { border-color: var(--accent); outline: none; }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 400 1.1rem var(--display); }
.person .who { min-width: 0; flex: 1; }
.person .name { font-weight: 700; }
.person .sub { font-size: .86rem; color: var(--muted); }
.tag { display: inline-block; font: 500 .75rem/1.5 var(--mono); padding: 0 8px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); }
.tag.due { border-color: var(--bad); color: var(--bad); }
input, textarea, select { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; min-height: 44px; }
textarea { min-height: 88px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 700 .95rem var(--body); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 4px 12px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font: 500 .86rem var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dt { color: var(--muted); font-size: .88rem; } dd { margin: 0; }
.log { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
.log time { font: 500 .8rem var(--mono); color: var(--muted); }
.msg { padding: 10px 14px; border-radius: 10px; max-width: 92%; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1.5px solid var(--line); width: 100%; max-width: 100%; }
.msg.bot .how { font-size: .8rem; color: var(--muted); }
.note { padding: 10px 14px; border-radius: 6px; border: 1.5px solid var(--line); font-size: .88rem; }
.note.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.note.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.map { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; align-items: center; font-size: .9rem; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: .85rem; min-width: 100%; }
th, td { border: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; text-align: left; }
.src { font: 500 .72rem/1.5 var(--mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.score { font: 500 .75rem var(--mono); color: var(--muted); }
.entry { padding: 12px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
.entry .body { white-space: pre-wrap; font-size: .92rem; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 5; min-height: 56px; padding: 0 22px; border-radius: 28px; background: var(--accent); color: var(--accent-ink); font: 400 1.15rem var(--display); display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgb(0 0 0 / .28); cursor: pointer; }
.fab:hover { outline: 3px solid var(--mark); outline-offset: 2px; }
.progress { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.scanimg { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); }
.form2 { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.form2 label { font-size: .9rem; color: var(--muted); }
details > summary { cursor: pointer; font-weight: 500; }
mark { background: var(--mark); color: var(--mark-fg); padding: 0 2px; border-radius: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const KEY = "connect-data-v1";
  const app = document.getElementById("app");
  const S = { scan: null, route: "find", pid: null, q: "", filter: "none", chat: [], ask: "", importState: null, msg: "", editing: false,
    kbQ: "", kbEdit: null, kbDraft: { title: "", text: "", tags: "" } };
  let DB = { version: 1, contacts: [], importedAt: null, sample: false, kb: { items: [] } };
  try { localStorage.removeItem("connect-mode-v1"); } catch { /* 예전 시연·개인 모드 설정은 더 쓰지 않는다 */ }

  /* ---------- 작은 유틸 ---------- */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "value") el.value = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c);
    return el;
  }
  const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };   // 이 기기 시간대의 날짜
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  const norm = s => String(s ?? "").toLowerCase().replace(/\(주\)|㈜|주식회사|\(유\)|유한회사|inc\.?|co\.?,?\s*ltd\.?|corp\.?|corporation|limited/g, "").replace(/[\s.,·\-_()]/g, "");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const lastContact = c => (c.logs || []).map(l => l.d).sort().at(-1) || null;
  const isDue = c => c.nextAt && c.nextAt <= today();

  function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && Array.isArray(d.contacts)) DB = d; } catch { /* 비어 있으면 새로 시작 */ }
    DB.kb = normKb(DB.kb);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); publishSummary(); return true; }
    catch { S.msg = "이 브라우저에 저장하지 못했습니다. 시크릿 모드라면 일반 창에서 열어 주세요."; return false; }
  }
  const byId = id => DB.contacts.find(c => c.id === id);
  /* 이 앱은 'connect-'로 시작하는 키만 쓴다. 공부방 첫 화면에는 숫자 요약 한 줄만 넘기고, 이름·연락처는 넘기지 않는다. */
  function publishSummary() {
    const list = DB.contacts, due = list.filter(isDue).length;
    const text = list.length ? `${DB.sample ? "샘플 " : ""}${list.length}명 · 회사 ${new Set(list.map(c => c.company).filter(Boolean)).size}곳 · 지식 ${DB.kb?.items?.length || 0}개` + (due ? ` · 연락할 사람 ${due}명` : "") : "아직 불러온 명함이 없습니다";
    try { localStorage.setItem("platform-summary:connect", JSON.stringify({ text, at: new Date().toISOString() })); } catch { /* 요약은 없어도 된다 */ }
  }
  /* 지식은 저장소 하나(items)다. 예전 공개·개인정보 두 저장소 형식은 하나로 합친다. */
  function normKb(kb) { return { items: [...(kb?.items || []), ...(kb?.public || []), ...(kb?.private || [])] }; }

  /* ---------- 라우팅 ---------- */
  function parseHash() {
    const r = location.hash.slice(1);
    if (r.startsWith("p-")) return { route: "person", pid: r.slice(2) };
    if (["import", "kb", "scan"].includes(r)) return { route: r };
    return { route: "find" };   // 예전 #people, #ask 주소도 찾기 화면으로
  }
  function go(hash) { if (location.hash !== "#" + hash) location.hash = hash; else render(); }
  window.addEventListener("hashchange", () => { Object.assign(S, parseHash(), { editing: false }); if (S.route !== "scan" && S.scan?.status === "saved") S.scan = null; render(); window.scrollTo(0, 0); });

  /* ---------- 엑셀·CSV 읽기 ---------- */
  let xlsxReady;
  function loadXlsx() {
    xlsxReady ||= new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = "vendor/xlsx.full.min.js"; s.onload = () => ok(window.XLSX); s.onerror = () => fail(new Error("엑셀 읽기 도구를 불러오지 못했습니다."));
      document.head.append(s);
    });
    return xlsxReady;
  }
  async function readRows(file) {
    const XLSX = await loadXlsx();
    const buf = await file.arrayBuffer();
    let wb;
    if (/\.csv$|\.txt$/i.test(file.name)) {
      let text;
      try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch { text = new TextDecoder("euc-kr").decode(buf); }
      wb = XLSX.read(text.replace(/^﻿/, ""), { type: "string", raw: true });
    } else {
      wb = XLSX.read(buf, { type: "array", cellDates: true });
    }
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
    // 제목 줄이 위에 있는 파일이 있어, 칸이 가장 많이 찬 앞쪽 줄을 머리글로 본다.
    let hi = 0, best = -1;
    grid.slice(0, 10).forEach((r, i) => { const n = r.filter(v => String(v).trim()).length; if (n > best) { best = n; hi = i; } });
    const headers = (grid[hi] || []).map(v => String(v).trim());
    const rows = grid.slice(hi + 1).filter(r => r.some(v => String(v).trim()));
    return { headers, rows };
  }

  /* 머리글 이름으로 칸 뜻을 짐작한다. 순서가 중요하다: '회사전화'는 회사가 아니라 전화다. */
  const FIELDS = [
    ["name", "이름"], ["lastName", "성"], ["firstName", "이름(성 뺀)"], ["company", "회사"], ["dept", "부서"], ["title", "직책"],
    ["mobile", "휴대폰"], ["phone", "전화"], ["email", "이메일"], ["address", "주소"], ["website", "웹사이트"],
    ["cardMemo", "명함 메모"], ["registeredAt", "등록일"], ["group", "그룹"]
  ];
  const RULES = [
    ["email", /e-?mail|이메일|메일/i], ["mobile", /휴대|핸드폰|모바일|mobile|cell/i], ["skip", /팩스|fax/i],
    ["phone", /전화|tel|phone|유선|직통/i], ["address", /주소|address/i], ["website", /홈페이지|웹|website|url|sns/i],
    ["dept", /부서|department|dept/i], ["title", /직책|직위|직급|직함|title|position/i],
    ["company", /회사|company|기관|소속|organization|단체/i], ["lastName", /^(성|last ?name|family ?name|surname)$/i],
    ["firstName", /^(first ?name|given ?name)$/i], ["name", /이름|성명|name/i], ["cardMemo", /메모|노트|memo|note|비고/i],
    ["registeredAt", /등록|교환|날짜|date|일자/i], ["group", /그룹|group|분류|카테고리/i]
  ];
  function guessMap(headers) {
    const used = new Set();
    return headers.map(hd => {
      const rule = RULES.find(([, re]) => re.test(hd));
      const f = rule ? rule[0] : "skip";
      if (f === "skip" || used.has(f)) return "skip";
      used.add(f); return f;
    });
  }
  function rowsToContacts(headers, rows, map) {
    return rows.map(r => {
      const c = {};
      map.forEach((f, i) => { if (f !== "skip") { const v = String(r[i] ?? "").trim(); if (v && !c[f]) c[f] = v; } });
      if (!c.name && (c.lastName || c.firstName)) c.name = `${c.lastName || ""}${c.firstName || ""}`.trim();
      delete c.lastName; delete c.firstName;
      return c;
    }).filter(c => c.name || c.company || c.email || c.mobile);
  }
  const keyOf = c => (c.email && "e:" + c.email.toLowerCase()) || (c.mobile && "m:" + c.mobile.replace(/\D/g, "")) || "n:" + norm(c.name) + "|" + norm(c.company);
  function mergeContacts(incoming) {
    if (DB.sample) { DB.contacts = []; DB.sample = false; }
    const index = new Map(DB.contacts.map(c => [keyOf(c), c]));
    let added = 0, updated = 0;
    const now = new Date().toISOString();
    for (const n of incoming) {
      const old = index.get(keyOf(n));
      if (old) { Object.assign(old, n, { updatedAt: now }); updated++; }
      else { const c = { id: uid(), tags: [], notes: "", logs: [], nextAt: "", createdAt: now, updatedAt: now, ...n }; DB.contacts.push(c); index.set(keyOf(c), c); added++; }
    }
    DB.importedAt = now;
    return { added, updated };
  }


  /* ---------- 명함 촬영: 기기 안 글자 인식(OCR) ----------
     사진은 서버로 보내지 않고 이 브라우저 안에서 Tesseract.js(vendor/ocr)로 한국어·영어 글자를 읽은 뒤, 아래 규칙(parseCard)으로 칸을 나눈다.
     사진 자체는 저장하지 않고, 사용자가 확인한 연락처만 저장한다. 글자 데이터는 브라우저 HTTP 캐시에만 두고 앱 저장소는 쓰지 않는다(cacheMethod: none). */
  const OCR_BASE = new URL("vendor/ocr/", location.href).href;
  const OCR_STEP = { "loading tesseract core": "글자 인식 엔진을 준비하는 중", "initializing tesseract": "글자 인식 엔진을 준비하는 중",
    "loading language traineddata": "한글·영문 글자 데이터를 받는 중 (처음 한 번은 오래 걸립니다)", "initializing api": "글자 인식 엔진을 준비하는 중", "recognizing text": "명함 글자를 읽는 중" };
  let ocrWorker = null;
  function loadScript(src) {
    return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("글자 인식 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.")); document.head.append(s); });
  }
  function paintProgress() {
    const st = document.getElementById("scanstep"), bar = document.getElementById("scanbar");
    if (st && S.scan) st.textContent = S.scan.step;
    if (bar && S.scan) bar.style.width = Math.round((S.scan.progress || 0) * 100) + "%";
  }
  function onOcr(m) {
    const sc = S.scan; if (!sc || sc.status !== "reading") return;
    if (OCR_STEP[m.status]) sc.step = OCR_STEP[m.status];
    const p = typeof m.progress === "number" ? m.progress : 0;
    sc.progress = m.status === "recognizing text" ? ((sc.pass || 0) + p) / OCR_PASSES.length : p;
    paintProgress();
  }
  function getOcr() {
    if (!ocrWorker) {
      ocrWorker = (async () => {
        if (!window.Tesseract) await loadScript(OCR_BASE + "tesseract.min.js");
        const w = await window.Tesseract.createWorker(["kor", "eng"], 1, { workerPath: OCR_BASE + "worker.min.js", corePath: OCR_BASE + "core", langPath: OCR_BASE + "lang", cacheMethod: "none", logger: onOcr });
        await w.setParameters({ tessedit_pageseg_mode: "3", preserve_interword_spaces: "1" });
        return w;
      })();
      ocrWorker.catch(() => { ocrWorker = null; });
    }
    return ocrWorker;
  }
  async function decodeImage(file) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }

  /* ---------- 샘플 (모두 가상의 인물·회사) ---------- */
  function loadSample() {

  /* ---------- 묻기: 기기 안에서 규칙으로 답한다 ---------- */
  /* ---------- 지식 검색: 기기 안 벡터 검색 ----------
     글을 한글 두 글자 조각과 낱말로 쪼개 TF-IDF 벡터로 만들고, 질문 벡터와의 코사인 유사도로 가까운 문단을 찾는다.
     외부 AI 모델 없이 동작하므로 데이터가 기기 밖으로 나가지 않는다. 대신 뜻이 비슷해도 글자가 전혀 다르면 찾지 못한다. */
  const STOP = new Set(["그리고", "하지만", "있습니다", "합니다", "입니다", "있는", "하는", "에서", "으로", "에게", "누구", "무엇", "뭐야", "알려", "알려줘", "어떻게", "어디", "언제", "있어", "있나요", "인가요", "뭔가요", "사람", "사람은", "사람이", "아는", "알고", "쪽", "분", "분들", "누가", "좀", "해줘", "해", "줘", "어떤", "관련", "대해", "대해서", "누구야", "누구지", "누구예요", "누군가요", "있을까", "있을까요", "알아", "아세요"]);
  function tokens(text) {
    const out = [];
    for (const w of String(text).toLowerCase().match(/[a-z0-9]+|[가-힣]+/g) || []) {
      if (STOP.has(w)) continue;
      if (/^[가-힣]+$/.test(w)) {
        if (w.length === 1) { out.push(w); continue; }
        for (let i = 0; i < w.length - 1; i++) out.push(w.slice(i, i + 2));
      } else if (w.length >= 2 || /\d/.test(w)) out.push(w);
    }
    return out;
  }
  function splitSentences(text) { return String(text).split(/(?<=[.!?。])\s+|\n+/).map(x => x.trim()).filter(Boolean); }
  function chunk(doc) {
    const sents = splitSentences(doc.text), out = [];
    let cur = [];
    for (const t of sents) { if (cur.join(" ").length + t.length > 260 && cur.length) { out.push(cur); cur = []; } cur.push(t); }
    if (cur.length) out.push(cur);
    return out.map((ss, i) => ({ ...doc, part: i, sents: ss, text: ss.join(" ") }));
  }
  function buildIndex(docs) {
    const chunks = docs.flatMap(chunk);
    const df = new Map();
    const tfs = chunks.map(c => {
      const tf = new Map();
      for (const t of [...tokens(c.title), ...tokens(c.title), ...tokens(c.text), ...tokens(c.extra || "")]) tf.set(t, (tf.get(t) || 0) + 1);
      for (const t of tf.keys()) df.set(t, (df.get(t) || 0) + 1);
      return tf;
    });
    const N = chunks.length;
    const idf = t => Math.log((N + 1) / ((df.get(t) || 0) + 1)) + 1;
    const vec = tf => { const v = new Map(); let n = 0; for (const [t, c] of tf) { const w = (1 + Math.log(c)) * idf(t); v.set(t, w); n += w * w; } n = Math.sqrt(n) || 1; for (const [t, w] of v) v.set(t, w / n); return v; };
    const vecs = tfs.map(vec);
    const embed = text => { const tf = new Map(); for (const t of tokens(text)) tf.set(t, (tf.get(t) || 0) + 1); return vec(tf); };
    const cos = (a, b) => { let d = 0; const [x, y] = a.size < b.size ? [a, b] : [b, a]; for (const [t, w] of x) d += w * (y.get(t) || 0); return d; };
    return {
      size: N,
      search(q, k = 5) {
        const qv = embed(q); if (!qv.size) return [];
        return chunks.map((c, i) => ({ c, score: cos(qv, vecs[i]) })).filter(r => r.score >= 0.1).sort((a, b) => b.score - a.score).slice(0, k)
          .map(r => ({ ...r, best: r.c.sents.map(t => ({ t, s: cos(qv, embed(t)) })).sort((a, b) => b.s - a.s) }));
      }
    };
  }
  /* 직책·부서에서 직무 낱말을 더해 명함 문서를 검색하기 쉽게 만든다. CFO에는 '임원 재무'를, IT전략팀에는 'IT 정보기술'을 붙인다. */
  const ROLE_WORDS = [
    [/대표|ceo|사장|부사장|전무|상무|이사|임원|본부장|cfo|cto|coo|cio|파트너|실장/i, "임원 경영진 의사결정자"],
    [/재무|회계|경리|자금|cfo|ir|세무|감사|finance/i, "재무 회계 재무담당"],
    [/영업|세일즈|sales|사업개발|판매/i, "영업 세일즈 영업담당"],
    [/마케팅|marketing|홍보|브랜드/i, "마케팅 홍보"],
    [/인사|hr|채용|총무/i, "인사 채용 HR"],
    [/(^|[^a-z])it([^a-z]|$)|전산|정보|개발|cto|cio|시스템|보안|디지털|dx/i, "IT 정보기술 전산 개발"],
    [/구매|조달|purchasing|소싱/i, "구매 조달"],
    [/법무|legal|컴플라이언스|준법/i, "법무 컴플라이언스"],
    [/생산|제조|품질|공장/i, "생산 제조 품질"],
    [/기획|전략|경영지원|조정/i, "기획 전략"]
  ];
  const roleWords = c => ROLE_WORDS.filter(([re]) => re.test(`${c.title || ""} ${c.dept || ""}`)).map(([, w]) => w).join(" ");

  /* 검색 대상 문서: 지식 전부와 명함(사람 카드·메모·기록) */
  function kbDocs() {
    const docs = DB.kb.items.map(e => ({ id: e.id, title: e.title, text: e.text, src: "kb" }));
    docs.push(...DB.contacts.map(c => ({ id: c.id, person: true, src: "card", title: `${c.name || ""} ${c.company || ""}`.trim(),
      extra: roleWords(c), text: [[c.company, c.dept, c.title].filter(Boolean).join(" ") + ".", (c.tags || []).length ? "태그 " + c.tags.join(", ") + "." : "", c.notes || "", ...(c.logs || []).map(l => `${l.d} ${l.t}`)].filter(Boolean).join("\n") })));
    return docs;
  }

  /* 입력 하나를 두 갈래로 나눈다.
     - 사람 이름(또는 이름 + 님/직함, 회사 이름만)이면 기본정보 카드만 보여 준다.
     - 그 밖의 구체적인 질문은 벡터 검색으로 지식과 명함 메모·기록에서 찾아 답한다. */
  const TITLES = "님|씨|팀장|부장|과장|대리|차장|실장|상무|전무|이사|대표|파트너|매니저|사원|주임|본부장|사장|프로|책임|선임|수석";
  /* 이름 앞부분 맞추기. 마지막 글자는 치는 중일 수 있어 'ㄱ'은 '권', '궈'도 '권'과 맞는 것으로 본다. */
  const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
  function namePrefix(name, t) {
    if (name.length < t.length) return false;
    for (let i = 0; i < t.length; i++) {
      const a = t[i], b = name[i];
      if (a === b) continue;
      if (i < t.length - 1) return false;
      const bc = b.charCodeAt(0) - 0xAC00; if (bc < 0 || bc > 11171) return false;
      const ci = CHO.indexOf(a); if (ci >= 0) return Math.floor(bc / 588) === ci;
      const ac = a.charCodeAt(0) - 0xAC00; if (ac < 0 || ac > 11171 || ac % 28) return false;
      return Math.floor(ac / 28) === Math.floor(bc / 28);
    }
    return true;
  }
  function classify(input) {
    const t = input.trim().replace(/[?？!.]+$/, "");
    if (!t || !DB.contacts.length) return { kind: "question" };
    const rest = new RegExp(`^\\s*(${TITLES})?\\s*(님)?\\s*(정보|연락처|누구)?\\s*$`);
    const byName = DB.contacts.filter(c => c.name && c.name.length >= 2 && t.startsWith(c.name) && rest.test(t.slice(c.name.length)));
    if (byName.length) return { kind: "person", people: byName };
    if (/^[가-힣]{0,3}[가-힣ㄱ-ㅎ]$/.test(t)) { const pre = DB.contacts.filter(c => c.name && namePrefix(c.name, t)); if (pre.length) return { kind: "person", people: pre }; }
    const byCo = DB.contacts.filter(c => c.company && norm(c.company) === norm(t.replace(/\s*(사람|직원|명함|목록|분들)$/, "")));
    if (byCo.length) return { kind: "company", people: byCo };
    return { kind: "question" };
  }
  function respond(q) {
    const cls = classify(q);
    if (cls.kind !== "question") return { basic: cls.people, kind: cls.kind };
    return { kb: buildIndex(kbDocs()).search(q) };
  }

  /* 휴대폰 연락처로 보내기: 웹 페이지는 연락처에 직접 쓸 수 없어 vCard(.vcf) 파일을 만들어 연다.
     폰이 그 파일을 열면 '새로운 연락처 생성'이나 '가져오기'로 저장한다. */
  function toVcf(c) {
    const esc = v => String(v || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/([,;])/g, "\\$1");
    const name = (c.name || "").trim();
    let fam = "", giv = name;
    if (/^[가-힣]{2,4}$/.test(name)) { const two = /^(남궁|황보|제갈|선우|독고|사공|서문|동방)/.test(name) && name.length > 2 ? 2 : 1; fam = name.slice(0, two); giv = name.slice(two); }
    else if (/^\S+\s+\S+$/.test(name)) [giv, fam] = name.split(/\s+/);
    const L = ["BEGIN:VCARD", "VERSION:3.0", `N:${esc(fam)};${esc(giv)};;;`, `FN:${esc(name || c.company || "명함")}`];
    if (c.company || c.dept) L.push(`ORG:${esc(c.company)}${c.dept ? ";" + esc(c.dept) : ""}`);
    if (c.title) L.push(`TITLE:${esc(c.title)}`);
    if (c.mobile) L.push(`TEL;TYPE=CELL:${c.mobile}`);
    if (c.phone) L.push(`TEL;TYPE=WORK,VOICE:${c.phone}`);
    if (c.fax) L.push(`TEL;TYPE=WORK,FAX:${c.fax}`);
    if (c.email) L.push(`EMAIL;TYPE=INTERNET,WORK:${c.email}`);
    if (c.website) L.push(`URL:${/^https?:/i.test(c.website) ? c.website : "http://" + c.website}`);
    if (c.address) L.push(`ADR;TYPE=WORK:;;${esc(c.address)};;;;`);
    L.push("END:VCARD");
    return L.join("\r\n");
  }
  function downloadVcf(list, fileName) {
    const url = URL.createObjectURL(new Blob([list.map(toVcf).join("\r\n") + "\r\n"], { type: "text/vcard;charset=utf-8" }));
    const a = h("a", { href: url, download: fileName.replace(/[\/:*?"<>|]/g, "") + ".vcf" }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  const phoneBtn = (c, cls = "btn ghost") => (c.mobile || c.phone || c.email) ? h("button", { class: cls, type: "button", onclick: () => downloadVcf([c], c.name || c.company || "연락처") }, "휴대폰 연락처에 저장") : null;

  function basicCard(c) {

      list.length ? h("input", { type: "search", "aria-label": "지식 찾기", placeholder: "넣은 지식에서 찾기", value: S.kbQ, oninput: e => { S.kbQ = e.target.value; refill("kb-list", kbList); } }) : null,
      h("div", { id: "kb-list", class: "stack" }, kbList()),
      h("p", { class: "muted small" }, "검색 방식: 글을 한글 두 글자 조각과 낱말로 쪼갠 TF-IDF 벡터로 만들고, 질문과 가장 가까운 문단을 코사인 유사도로 찾습니다. 외부 AI를 쓰지 않아 데이터가 기기 밖으로 나가지 않는 대신, 뜻이 같아도 쓰인 낱말이 전혀 다르면 찾지 못합니다.")];
  }

  function viewImport() {
    const st = S.importState;
    const pick = h("input", { type: "file", accept: ".xls,.xlsx,.csv,.txt", "aria-label": "명함 파일", onchange: async e => {
      const f = e.target.files[0]; if (!f) return;
      S.importState = { loading: true, file: f.name }; render();
      try {
        const { headers, rows } = await readRows(f);
        if (!headers.length || !rows.length) throw new Error("파일에서 표를 찾지 못했습니다.");
        S.importState = { file: f.name, headers, rows, map: guessMap(headers) };
      } catch (err) { S.importState = { error: err.message || "파일을 읽지 못했습니다." }; }
      render();
    } });
    const out = [header("가져오기", "리멤버에서 내보낸 엑셀(XLS·XLSX)이나 CSV를 올립니다."),
      h("div", { class: "note" }, "파일은 이 기기의 브라우저 안에서만 읽고 저장합니다. 서버나 저장소로 보내지 않습니다. 같은 사람(이메일·휴대폰·이름+회사가 같은 사람)을 다시 가져오면 명함 정보만 새로 고치고, 태그·기록·메모는 그대로 둡니다."),
      h("div", { class: "card" }, h("h3", null, "종이 명함은 찍어서"), h("p", { class: "small" }, "명함을 찍으면 바로 칸을 채워 줍니다. 한 장씩 넣을 때 편합니다."), h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: () => go("scan") }, "명함 촬영으로"))),
      h("div", { class: "card" }, h("h3", null, "1. 리멤버에서 파일 받기"),
        h("p", { class: "small" }, "리멤버 앱 → 설정 → 명함 내보내기 → 전체 선택 → 엑셀 파일 받기 → 받은 메일의 첨부 파일을 이 기기에 저장합니다. 메뉴 이름은 앱 버전에 따라 조금 다를 수 있습니다.")),
      h("div", { class: "card" }, h("h3", null, "2. 파일 고르기"), pick,
        st?.loading ? h("p", { class: "muted small" }, `${st.file} 읽는 중…`) : null,
        st?.error ? h("div", { class: "note bad" }, st.error + " 엑셀에서 열어 CSV(UTF-8)로 다시 저장한 뒤 올려 보세요.") : null)];
    if (st?.headers) {
      const preview = rowsToContacts(st.headers, st.rows, st.map);
      out.push(h("div", { class: "card" },
        h("h3", null, "3. 칸 맞추기"),
        h("p", { class: "small" }, `${st.file}: ${st.rows.length}줄. 머리글을 보고 칸 뜻을 짐작했습니다. 틀린 칸은 고쳐 주세요.`),
        h("div", { class: "map" }, st.headers.map((hd, i) => [h("span", null, hd || `(${i + 1}번째 칸)`),
          h("select", { "aria-label": `${hd} 칸의 뜻`, onchange: e => { st.map[i] = e.target.value; render(); } },
            [["skip", "가져오지 않음"], ...FIELDS].map(([v, l]) => h("option", { value: v, selected: st.map[i] === v ? true : null }, l)))])),
        h("p", { class: "small muted" }, "미리 보기 (앞의 3명)"),
        h("div", { class: "tablewrap" }, h("table", null,
          h("thead", null, h("tr", null, ["이름", "회사", "부서", "직책", "휴대폰", "이메일"].map(x => h("th", null, x)))),
          h("tbody", null, preview.slice(0, 3).map(c => h("tr", null, [c.name, c.company, c.dept, c.title, c.mobile, c.email].map(v => h("td", null, v || ""))))))),
        h("button", { class: "btn", disabled: !preview.length || !st.map.includes("name") && !st.map.includes("lastName"), onclick: () => {
          const r = mergeContacts(preview);
          if (save()) { S.importState = null; S.msg = ""; S.flash = `새로 ${r.added}명, 갱신 ${r.updated}명을 가져왔습니다.`; go("import"); }
        } }, `${preview.length}명 가져오기`)));
    }
    if (S.flash) out.push(h("div", { class: "note good", role: "status" }, S.flash));
    out.push(h("div", { class: "card" }, h("h3", null, "백업과 지우기"),
      h("p", { class: "small" }, "명함, 기록, 지식은 이 브라우저에만 있습니다. 브라우저 데이터를 지우면 사라지니 가끔 백업 파일로 저장하세요. 다른 기기로 옮길 때도 씁니다. 백업 파일에는 연락처가 들어 있으니 안전한 곳에 두세요."),
      h("div", { class: "row" },
        h("button", { class: "btn ghost", disabled: !DB.contacts.length && !DB.kb.items.length, onclick: () => {
          const url = URL.createObjectURL(new Blob([JSON.stringify({ app: "connect", ...DB, exportedAt: new Date().toISOString() }, null, 1)], { type: "application/json" }));
          const a = h("a", { href: url, download: `connect-백업-${today()}.json` }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
        } }, "백업 파일 저장"),
        h("button", { class: "btn ghost", disabled: !DB.contacts.length, onclick: () => downloadVcf(DB.contacts.filter(c => c.mobile || c.phone || c.email), `connect-연락처-${today()}`) }, "전체를 휴대폰 연락처 파일로"),
        h("label", { class: "btn ghost", for: "restore" }, "백업 불러오기"),
        h("input", { id: "restore", type: "file", accept: ".json,application/json", hidden: true, onchange: async e => {
          try { const d = JSON.parse(await e.target.files[0].text()); if (d.app !== "connect" || !Array.isArray(d.contacts)) throw 0; DB = { version: 1, contacts: d.contacts, importedAt: d.importedAt, sample: !!d.sample, kb: normKb(d.kb) }; save(); S.flash = `백업에서 ${d.contacts.length}명, 지식 ${DB.kb.items.length}개를 불러왔습니다.`; render(); }
          catch { S.flash = ""; S.msg = "Connect 백업 파일이 아닙니다."; render(); }
        } }),
        h("button", { class: "btn danger", disabled: !DB.contacts.length && !DB.kb.items.length, onclick: () => { if (confirm("이 기기에 저장된 명함, 기록, 지식을 모두 지울까요? 되돌릴 수 없습니다.")) { DB = { version: 1, contacts: [], importedAt: null, sample: false, kb: { items: [] } }; save(); S.flash = "모두 지웠습니다."; render(); } } }, "모두 지우기")),
      !DB.contacts.length ? h("button", { class: "btn ghost", onclick: loadSample }, "샘플로 둘러보기") : null));
    return out;
  }

  function render() {
    const view = S.route === "person" ? viewPerson() : S.route === "kb" ? viewKb() : S.route === "import" ? viewImport() : S.route === "scan" ? viewScan() : viewFind();
    app.replaceChildren(...[view].flat(Infinity).filter(Boolean));
    if (S.route !== "import") S.flash = "";
  }

  load();
  publishSummary();
  Object.assign(S, parseHash());
  render();
})();
</script>
</body>
</html>
